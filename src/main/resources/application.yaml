ktor:
  development: "$DEVELOPMENT:false"
  application:
    modules:
      - de.ingrid.ingridapi.ApplicationKt.base
      - de.ingrid.ingridapi.ApplicationKt.security
      - de.ingrid.ingridapi.ApplicationKt.portal
      - de.ingrid.ingridapi.ApplicationKt.ogcRecords
      - de.ingrid.ingridapi.ApplicationKt.openSearch
      - de.ingrid.ingridapi.ApplicationKt.atom
      - de.ingrid.ingridapi.ApplicationKt.admin
  deployment:
    port: $SERVER_PORT:8080
    watch:
      - classes
      - resources
    rootPath: "$CONTEXT_PATH:"
  elasticsearch:
    host: "$ES_HOST:localhost"
    port: "$ES_PORT:9200"
    https: "$ES_HTTPS:false"
    username: "$ES_USERNAME:"
    password: "$ES_PASSWORD:"
    indexPrefix: "$INDEX_PREFIX:"
  keycloak:
    serverUrl: "$KEYCLOAK_SERVER_URL:http://localhost:8080"
    realm: "$KEYCLOAK_REALM:InGrid"
    clientId: "$KEYCLOAK_CLIENT_ID:ingrid-api"
    clientSecret: "$KEYCLOAK_CLIENT_SECRET:B8L4SgFXeRcLazRgPp0HAN24HvFHltKv"
  security:
    authDisabled: "$AUTH_DISABLED:false"
  session:
    signKey: "$SESSION_SIGN_KEY:000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
    secure: "$SESSION_SECURE:true"
  opensearch:
    shortName: "$OS_SHORT_NAME:InGrid OpenSearch"
    description: "$OS_DESCRIPTION:Here you can search inside the InGrid data space."
    tags: "$OS_TAGS:ingrid opensearch web"
    contact: "$OS_CONTACT:"
    channelDescription: "$OS_CHANNEL_DESCRIPTION:Search results"
    detailsUrl: "$OS_DETAILS_URL:"
    maxHitsPerPage: "$OS_MAX_HITS_PER_PAGE:100"
    # --- UVP: settings that are only used in UVP mode, removed together with UvpSupport ---
    uvp:
      language: "$OS_UVP_LANGUAGE:"
      copyright: "$OS_UVP_COPYRIGHT:"
  atom:
    metadataAccessUrl: "$ATOM_METADATA_ACCESS_URL:"
    metadataDetailsUrl: "$ATOM_METADATA_DETAILS_URL:"
    urlConnectTimeout: "$ATOM_URL_CONNECT_TIMEOUT:1000"
    urlReadTimeout: "$ATOM_URL_READ_TIMEOUT:1000"
    queryExtension: "$ATOM_QUERY_EXTENSION:"
    supportedLanguages: "$ATOM_SUPPORTED_LANGUAGES:de"
